<div class="app" id="app" data-ver="1.1.0">
  <header class="topbar">
    <button class="brand" id="btn-set" aria-label="Ajustes"><svg><use href="#logo"/></svg><div><div class="wm">Agarrao</div><div class="wm-tag">Más que un chotis</div></div></button>
    <div class="tb-r">
      <button class="icbtn ghost" id="btn-chat" aria-label="Hablar con el Chulapo"><svg class="f"><use href="#i-chatf"/></svg></button>
      <button class="icbtn ghost" id="btn-bell" aria-label="Pendiente"><svg class="f"><use href="#i-bellf"/></svg><span class="bdot"></span></button>
    </div>
  </header>

  <main class="views" id="views">
    <section class="view" id="v-hoy"></section>
    <section class="view" id="v-pres" hidden></section>
    <section class="view" id="v-dinero" hidden></section>
    <section class="view" id="v-piso" hidden></section>
  </main>

  <nav class="tabbar">
    <button class="tab on" data-tab="hoy"><svg class="i"><use href="#i-home"/></svg>Hoy</button>
    <button class="tab" data-tab="pres"><svg class="i"><use href="#i-pie"/></svg>Presupuesto</button>
    <button class="tab-add" id="btn-add" aria-label="Apuntar gasto"><svg class="i"><use href="#i-plus"/></svg></button>
    <button class="tab" data-tab="dinero"><svg class="i"><use href="#i-wallet"/></svg>Dinero</button>
    <button class="tab" data-tab="piso"><svg class="i"><use href="#i-key"/></svg>Piso</button>
  </nav>

  <div class="upd" id="upd" hidden>Hay una versión nueva<button id="upd-go">Actualizar</button></div>
  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="sh-add" role="dialog" aria-label="Apuntar gasto">
    <div class="grab"></div>
    <div class="add-top"><span class="lbl">Nuevo gasto</span><input type="date" id="add-date" class="date-pill" aria-label="Fecha del gasto"><button class="x" data-close aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="amt"><div class="big zero" id="amt">0<span class="dec">,00 €</span></div></div>
    <div class="favs" id="add-favs"></div>
    <div class="cats" id="add-cats"></div>
    <div class="add-line"><input class="note" id="add-note" placeholder="Concepto (opcional)" autocomplete="off"><button class="com-pill" id="add-com" aria-pressed="false">Común</button></div>
    <div class="seg" id="add-com-mode" hidden><button data-cm="pend" class="on">Me lo cojo de la común</button><button data-cm="yo">Lo asumo yo</button></div>
    <div class="pad" id="pad"></div>
    <button class="cta" id="add-save" disabled>Apuntar</button>
  </div>

  <div class="sheet" id="sh-form" role="dialog" aria-label="Ficha"></div>
  <div class="sheet" id="sh-set" role="dialog" aria-label="Ajustes"></div>
  <div class="sheet" id="sh-sub" role="dialog" aria-label="Detalle"></div>
  <div class="sheet chat" id="sh-chat" role="dialog" aria-label="El Chulapo">
    <div class="grab"></div>
    <div class="sh-h"><div class="chat-h"><svg><use href="#logo"/></svg><div><h3>El Chulapo</h3><div class="rs">Tu asistente castizo · funciona sin internet</div></div></div><button class="x" data-close aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chips" id="chat-chips"></div>
    <form class="chat-in" id="chat-form"><input id="chat-in" placeholder="«12,50 cañas» o «¿cuánto me queda?»" autocomplete="off" aria-label="Escríbele al Chulapo"><button class="send" aria-label="Enviar"><svg class="i"><use href="#i-up"/></svg></button></form>
  </div>

  <div class="overlay onb out" id="onb" aria-hidden="true"></div>
  <div class="overlay onb inst out" id="inst" aria-hidden="true"></div>
  <div class="overlay lock out" id="lock" aria-hidden="true"></div>

  <div class="scrim" id="scrim2"></div>
  <div class="sheet padsheet" id="sh-pad" role="dialog" aria-label="Calculadora">
    <div class="grab"></div>
    <div class="add-top"><span class="lbl" id="pad2-t">Importe</span><button class="x" id="pad2-x" aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="amt"><div class="big" id="pad2-d">0</div></div>
    <button class="pad2-neg" id="pad2-neg" hidden>± Cambiar signo</button>
    <div class="pad" id="pad2"></div>
    <button class="cta" id="pad2-ok">Listo</button>
  </div>
  <div class="toast" id="toast" role="status"><svg class="lg0"><use href="#logo"/></svg><div id="toast-t"></div><button id="toast-undo" hidden>Deshacer</button></div>
  <div class="busy" id="busy" aria-live="polite"><div><svg><use href="#logo"/></svg><span>Un momento…</span></div></div>
</div>
<script src="app.js" defer></script>
</body>
</html>
